name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package or app version where you saw it.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      description: For example MacBook Air M2, macOS 15; or Pixel 8, Android 15.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
